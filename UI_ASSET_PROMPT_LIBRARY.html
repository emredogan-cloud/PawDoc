<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PawDoc — UI Asset Prompt Library</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#000; --bg-1:#070906; --bg-2:#0b0f0b; --bg-3:#111710;
  --line:rgba(163,230,53,.14); --line-2:rgba(255,255,255,.07);
  --lime:#a3e635; --lime-2:#bef264; --lime-dim:rgba(163,230,53,.10);
  --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24; --red:#ef4444; --orange:#fb923c;
  --txt:#eef2e6; --txt-2:#a3ab98; --txt-3:#6b7364;
  --r:14px; --sb:288px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 620px at 78% -8%,rgba(163,230,53,.07),transparent 62%)}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-9999px;top:0;background:var(--lime);color:#000;padding:10px 16px;
  border-radius:0 0 10px 0;z-index:100;font-weight:700}
.skip:focus{left:0}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);gap:0;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line-2);background:linear-gradient(180deg,#080b07,#000);padding:18px 14px 40px}
.main{min-width:0;padding:22px 26px 96px}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.brand svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 7px rgba(163,230,53,.5))}
.brand b{font-size:17px;letter-spacing:-.2px}
.brand b i{font-style:normal;color:var(--lime)}
.brand small{display:block;color:var(--txt-3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:1px}

/* ---------- search ---------- */
.search{position:relative;margin:16px 0 12px}
.search input{width:100%;padding:11px 34px 11px 34px;background:var(--bg-2);color:var(--txt);
  border:1px solid var(--line);border-radius:11px;font:14px var(--sans)}
.search input::placeholder{color:var(--txt-3)}
.search input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(163,230,53,.13)}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-3);
  pointer-events:none;display:flex}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--txt-3);cursor:pointer;font-size:17px;line-height:1;padding:5px 7px;border-radius:7px}
.search .clr:hover{color:var(--txt);background:var(--bg-3)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:#0d120c;
  font:10px/1 var(--mono);color:var(--txt-3)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
.stat{background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 10px}
.stat b{display:block;font-size:19px;line-height:1.15;color:var(--lime);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--txt-3);letter-spacing:.055em;text-transform:uppercase}

/* ---------- filter groups ---------- */
.grp{margin-bottom:16px}
.grp>h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt-3);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.grp>h3 button{background:none;border:0;color:var(--lime);cursor:pointer;font:inherit;
  letter-spacing:.04em;text-transform:none;padding:2px 4px;border-radius:5px}
.grp>h3 button:hover{background:var(--lime-dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--txt-2);font-size:12px;
  transition:background .13s,border-color .13s,color .13s;user-select:none}
.chip:hover{border-color:var(--line);color:var(--txt)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip .n{font:10.5px var(--mono);color:var(--txt-3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--lime-dim);border-color:var(--lime);color:var(--lime-2)}
.chip.on .n{color:var(--lime)}
.chip .dot{width:7px;height:7px;border-radius:99px;background:currentColor;flex:none}

/* ---------- main header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;
  padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.top h1{margin:0 0 5px;font-size:25px;letter-spacing:-.4px}
.top h1 span{color:var(--lime)}
.top p{margin:0;color:var(--txt-2);font-size:13.5px;max-width:64ch}
.tools{display:flex;flex-wrap:wrap;gap:7px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--txt);font:13px var(--sans);
  transition:background .13s,border-color .13s}
.btn:hover{border-color:var(--line);background:var(--bg-3)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#0a0f06;font-weight:650}
.btn.pri:hover{background:var(--lime-2);border-color:var(--lime-2)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-bottom:16px;
  color:var(--txt-3);font-size:12.5px}
.bar b{color:var(--lime);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--txt-2);cursor:pointer;font:12.5px var(--sans);
  padding:5px 11px;border-radius:7px}
.seg button[aria-pressed=true]{background:var(--lime-dim);color:var(--lime-2)}

/* ---------- sections ---------- */
.sec{margin-bottom:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg-1);overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px;
  background:linear-gradient(90deg,rgba(163,230,53,.05),transparent 62%);position:sticky;top:0;z-index:3;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:linear-gradient(90deg,rgba(163,230,53,.09),transparent 62%)}
.sec>summary .tw{transition:transform .17s;color:var(--lime);display:flex;flex:none}
.sec[open]>summary .tw{transform:rotate(90deg)}
.sec>summary h2{margin:0;font-size:14.5px;font-weight:640;letter-spacing:-.1px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>summary .cnt{font:11px var(--mono);color:var(--txt-3);background:var(--bg-2);border:1px solid var(--line-2);
  padding:2px 8px;border-radius:99px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:13px;padding:13px 16px 17px}

/* ---------- card ---------- */
.card{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:13px;
  display:flex;flex-direction:column;gap:10px;transition:border-color .14s;min-width:0}
.card:hover{border-color:var(--line)}
.card:target,.card.hl{border-color:var(--lime);box-shadow:0 0 0 3px rgba(163,230,53,.13)}
.chead{display:flex;gap:11px;align-items:flex-start;min-width:0}
.thumb{width:52px;height:52px;flex:none;border-radius:10px;border:1px dashed var(--line);
  background:radial-gradient(circle at 50% 42%,rgba(163,230,53,.13),transparent 68%),#0a0e08;
  display:grid;place-items:center;color:var(--lime);opacity:.62}
.chead .t{min-width:0;flex:1}
.aid{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--lime);
  letter-spacing:.03em;flex-wrap:wrap}
.aid .was{color:var(--txt-3);font-size:10px}
.ttl{margin:3px 0 0;font-size:14px;font-weight:600;line-height:1.35}
.aside{margin:3px 0 0;font-size:11.5px;color:var(--amber);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;padding:2.5px 7px;border-radius:99px;background:var(--bg-3);
  border:1px solid var(--line-2);color:var(--txt-2);white-space:nowrap}
.tag.p1{color:#0a0f06;background:var(--lime);border-color:var(--lime);font-weight:650}
.tag.p2{color:var(--lime-2);border-color:rgba(163,230,53,.4);background:var(--lime-dim)}
.tag.p3{color:var(--cyan);border-color:rgba(34,211,238,.35)}
.tag.p4{color:var(--violet);border-color:rgba(167,139,250,.35)}
.tag.p5{color:var(--amber);border-color:rgba(251,191,36,.32)}
.tag.p6{color:var(--txt-2)}
.tag.alpha{color:var(--cyan);border-color:rgba(34,211,238,.32)}
.tag.warn{color:var(--amber);border-color:rgba(251,191,36,.34)}
.tag.stop{color:var(--red);border-color:rgba(239,68,68,.38)}
.tag.new{color:var(--orange);border-color:rgba(251,146,60,.4)}

.meta{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:12px;
  border-top:1px solid var(--line-2);padding-top:10px}
.meta dt{color:var(--txt-3)}
.meta dd{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--txt);min-width:0;overflow-wrap:anywhere}
.meta dd.plain{font-family:var(--sans);font-size:12px;color:var(--txt-2)}
.scr{display:flex;flex-wrap:wrap;gap:4px}
.scr code{font:10.5px var(--mono);background:var(--bg-3);border:1px solid var(--line-2);
  padding:1.5px 5px;border-radius:5px;color:var(--txt-2)}
.scr code.more{color:var(--lime);cursor:pointer;border-color:var(--line)}

.pw{border-top:1px solid var(--line-2);padding-top:10px}
.pw h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.pw h4 .len{font:10px var(--mono);color:var(--txt-3);text-transform:none;letter-spacing:0}
.prompt{margin:0;font:12.2px/1.62 var(--mono);color:#cfe0bb;background:#060a05;
  border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;white-space:pre-wrap;
  max-height:158px;overflow:hidden;position:relative;transition:max-height .2s}
.prompt.open{max-height:none}
.pw.clip .prompt:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;
  background:linear-gradient(transparent,#060a05)}
.more-btn{background:none;border:0;color:var(--lime);cursor:pointer;font:12px var(--sans);
  padding:5px 2px 0;text-decoration:underline;text-underline-offset:2px}
.prompt.na{color:var(--amber)}

.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:2px}
.cbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:8px;cursor:pointer;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt);font:12px var(--sans);
  transition:background .13s,border-color .13s,color .13s}
.cbtn:hover{border-color:var(--line);background:#141a11}
.cbtn.main{background:var(--lime-dim);border-color:rgba(163,230,53,.42);color:var(--lime-2);font-weight:600}
.cbtn.main:hover{background:rgba(163,230,53,.19)}
.cbtn.ok{background:var(--lime);border-color:var(--lime);color:#0a0f06;font-weight:650}
.cbtn svg{flex:none}
.cbtn[disabled]{opacity:.42;cursor:not-allowed}

.note{border-top:1px solid var(--line-2);padding-top:9px;font-size:11.5px;color:var(--amber);
  display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.note svg{flex:none;margin-top:1px}
.note.ok{color:var(--lime-2)}

.empty{text-align:center;padding:76px 20px;color:var(--txt-3)}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:7px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:60;
  background:var(--lime);color:#0a0f06;font-weight:650;font-size:13.5px;padding:10px 18px;border-radius:99px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .17s,transform .17s;
  display:flex;align-items:center;gap:7px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:#fff}

/* ---------- mobile ---------- */
.menu{display:none}
.scrim{display:none}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(85vw,var(--sb));z-index:50;
    transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 44px rgba(0,0,0,.75);height:100dvh}
  body.nav .side{transform:none}
  body.nav{overflow:hidden}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .22s}
  body.nav .scrim{opacity:1;pointer-events:auto}
  .menu{display:inline-flex;align-items:center;gap:7px;position:sticky;top:0;z-index:30;width:100%;
    padding:11px 14px;background:rgba(0,0,0,.9);backdrop-filter:blur(11px);
    border:0;border-bottom:1px solid var(--line-2);color:var(--txt);font:13.5px var(--sans);cursor:pointer}
  .main{padding:0 14px 84px}
  .top,.bar,.sec{margin-left:0;margin-right:0}
  .top{padding-top:16px}
  .grid{grid-template-columns:1fr;padding:11px 11px 15px}
  .meta{grid-template-columns:80px minmax(0,1fr)}
}
@media (max-width:430px){ .stats{grid-template-columns:1fr} .top h1{font-size:21px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.tools,.acts,.menu,.bar,.scrim,.toast{display:none!important}
  .wrap{grid-template-columns:1fr}body{background:#fff;color:#000}
  .prompt{max-height:none;color:#000;background:#f6f6f6;border-color:#ccc}
  .card,.sec{border-color:#ccc;background:#fff;break-inside:avoid}
}
</style>
</head>
<body>
<a class="skip" href="#results">Skip to assets</a>

<button class="menu" id="menu" aria-expanded="false" aria-controls="side">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  Filters &amp; search
</button>
<div class="scrim" id="scrim"></div>

<div class="wrap">
<aside class="side" id="side" aria-label="Filters">
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="13" cy="15" rx="5" ry="6.4" fill="#a3e635"/><ellipse cx="24" cy="11" rx="5.2" ry="6.8" fill="#a3e635"/>
      <ellipse cx="35" cy="15" rx="5" ry="6.4" fill="#a3e635"/><ellipse cx="42" cy="25.5" rx="4.3" ry="5.4" fill="#a3e635"/>
      <path d="M24 20c7.5 0 13 5.4 13 11.6C37 38 31.6 42 24 42S11 38 11 31.6C11 25.4 16.5 20 24 20z" fill="#a3e635"/>
      <path d="M24 36.4c-3.3-2.4-5.4-4.3-5.4-6.5 0-1.8 1.4-3.1 3.1-3.1 1 0 2 .5 2.3 1.2.4-.7 1.3-1.2 2.3-1.2 1.7 0 3.1 1.3 3.1 3.1 0 2.2-2.1 4.1-5.4 6.5z" fill="#050805"/>
    </svg>
    <div><b>Paw<i>Doc</i></b><small>Prompt Library</small></div>
  </div>

  <div class="search">
    <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="q" type="search" placeholder="Search assets…  /" aria-label="Search assets" autocomplete="off" spellcheck="false">
    <button class="clr" id="clr" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grp"><h3>Priority <button type="button" data-reset="priority">reset</button></h3><div class="chips" id="fpri"></div></div>
  <div class="grp"><h3>Family <button type="button" data-reset="family">reset</button></h3><div class="chips" id="ffam"></div></div>
  <div class="grp"><h3>Format <button type="button" data-reset="format">reset</button></h3><div class="chips" id="ffmt"></div></div>
  <div class="grp"><h3>Attributes <button type="button" data-reset="attr">reset</button></h3><div class="chips" id="fatt"></div></div>
  <div class="grp"><h3>Screen <button type="button" data-reset="screen">reset</button></h3><div class="chips" id="fscr"></div></div>
</aside>

<main class="main">
  <div class="top">
    <div>
      <h1>UI Asset <span>Prompt Library</span></h1>
      <p>Production prompts for GPT&nbsp;Image, generated from <code>UI_ASSET_SPECIFICATION.md</code>.
         Works fully offline — no network, no dependencies.</p>
    </div>
    <div class="tools">
      <button class="btn" id="expand" type="button">Expand all</button>
      <button class="btn" id="collapse" type="button">Collapse all</button>
      <button class="btn pri" id="copyAll" type="button">Copy visible prompts</button>
    </div>
  </div>

  <div class="bar">
    <span><b id="shown">0</b> of <b id="total">0</b> assets</span>
    <span aria-hidden="true">·</span>
    <span>Group by</span>
    <span class="seg" role="group" aria-label="Group by">
      <button type="button" data-group="family" aria-pressed="true">Family</button>
      <button type="button" data-group="screen" aria-pressed="false">Screen</button>
      <button type="button" data-group="priority" aria-pressed="false">Priority</button>
    </span>
    <span aria-hidden="true">·</span>
    <span><span class="kbd">/</span> search &nbsp; <span class="kbd">E</span> expand &nbsp; <span class="kbd">Esc</span> clear</span>
  </div>

  <div id="results" tabindex="-1"></div>
</main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

ers, no UI panels.","hasPrompt":true},{"id":"AI-304","alias":"","title":"Circular AI-scan loading composite ⭐","aside":"","family":"AI","familyName":"AI System","filename":"ai-loading-scan-ring@3x.png","folder":"assets/images/ai/","category":"Loading artwork / composite","usedOn":"ai_analysis_loading","screens":["ai_analysis_loading"],"global":false,"reusable":"Yes (any analysis-in-progress state)","transparency":"Required","format":"PNG (deliver the ring as a separate layer so Flutter can animate the arc)","resolution":"1080 × 1140 @3x","status":"","files":1,"renamed":false,"revised":false,"priority":"P2","prompt":"Layer 1 — masked portrait: A photorealistic Golden Retriever head in three-quarter profile facing left, mouth open, identical casting to the PawDoc hero dog, masked inside a perfect circle. Over the portrait, a faint square wireframe grid and a subtle radar crosshair, both in translucent lime green at low opacity. Deep green particle bloom behind the circle. Layer 2 — progress ring, transparent background: A thick circular arc in bright lime green #A3E635 tracing roughly 72 % of a circle with rounded ends, each end carrying a bright glowing cap. A second, thinner, dimmer full circle sits just inside it as the track. Strong neon bloom, no text, no percentage numerals — the number is rendered by Flutter.","hasPrompt":true},{"id":"AI-305","alias":"","title":"Holographic wireframe dog + cat ⭐","aside":"","family":"AI","familyName":"AI System","filename":"ai-hologram-dog-cat@3x.png","folder":"assets/images/ai/","category":"AI artwork / hero","usedOn":"ai_transparency","screens":["ai_transparency"],"global":false,"reusable":"Recommended for AI-explainer surfaces","transparency":"Required","format":"PNG","resolution":"1000 × 1000 @3x","status":"","files":1,"renamed":false,"revised":false,"priority":"P6","prompt":"A holographic projection illustration. A dog sitting upright with a cat sitting beside and slightly in front of it, both rendered as translucent green st the bell. Strong neon bloom throughout, with fine green light particles and a few four-point sparkle stars floating around it. Floating with no ground contact. Isolated on a fully transparent background, alpha channel, no shadow, no text.","hasPrompt":true},{"id":"ICN-801","alias":"","title":"Core UI line-icon set (~140 glyphs) ⭐","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/core/ic-<name>.svg","folder":"assets/icons/core/","category":"Icon family","usedOn":"All 57 screens","screens":[],"global":true,"reusable":"Yes — the backbone of the UI","transparency":"Required (SVG, currentColor)","format":"SVG only — must recolour to lime / red / cyan / violet / amber at runtime","resolution":"24 × 24 viewBox, 1.5 px stroke, rounded caps and joins","status":"","files":140,"renamed":false,"revised":false,"priority":"P1","prompt":"A single minimal line icon centred on a pure white background, drawn in flat black with one uniform medium stroke weight, rounded caps and rounded joins, no fill, no shading, no gradient, no colour, no text, no frame. Geometric and balanced, designed to read clearly at 24 pixels, generous inner spacing, consistent with the Lucide icon family. Subject: <glyph> — e.g. a veterinarian's head and shoulders with a stethoscope around the neck / a dog's head in side profile / a food bowl seen at a three-quarter angle / a microchip implant card / a weight scale with a paw print on its platform / a grooming brush with bristles.","hasPrompt":true},{"id":"ICN-802","alias":"","title":"Symptom pictogram set (24) ⭐","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/symptoms/ic-symptom-<name>.svg","folder":"assets/icons/symptoms/","category":"Icon family / medical pictograms","usedOn":"symptom_selection, prepare_for_vet_visit, ai_assistant_home, first_aid_guide","screens":["ai_assistant_home","first_aid_guide","prepare_for_vet_visit","symptom_selection"],"global":false,"reusable":"Yes — safety-critical, appears wherever symptoms are chosen","transparency":"Required","format":"SVG (currentColor)","resolution":"24 × 24 viewBox, 1.5 px stroke; generate at 1024 × 1024 then vectorise","status":"","files":24,"renamed":false,"revised":false,"priority":"P2","prompt":"A single minimal veterinary symptom pictogram centred on a pure white background, drawn in flat black with one uniform medium stroke weight, rounded caps and joins, no fill, no colour, no text, no frame. Clear, calm and clinical rather than cartoonish; instantly readable at 24 pixels. Subject: skin-irritation — a patch of skin with a few fur strands rising from it and a scattered cluster of small dots indicating a rash. itching — a paw with three short curved motion lines beside it and two small spark marks. ear-problem — a single dog ear seen from the side, with one small curved wave line beside it. eye-discharge — an almond-shaped eye with a pupil, lashes above and one small teardrop below. coughing — a dog's head in side profile with three short puff shapes emerging from the muzzle. sneezing — a muzzle and nose in side profile with a fan of small droplet marks spraying forward. vomiting — a simplified stomach organ outline. diarrhea — a simplified looped intestine outline. appetite-loss — an empty food bowl seen at a slight three-quarter angle. lethargy — a dog curled up asleep with three \"z\" marks of decreasing size rising from it. limping — a single leg bone with rounded ends, tilted. bloating — a rounded distended abdomen outline with two short pressure lines at its sides. breathing-difficulty — a pair of lungs with a short wave line across them. excessive-thirst — a water bowl with three droplets above it. weight-loss — a downward trend arrow over a simplified animal silhouette. hair-loss — a patch of skin with three fur strands detaching and falling away. bad-breath — a muzzle in profile with two wavy odour lines. swelling — a limb outline with a raised rounded bulge and two short radiating lines. seizure — a head silhouette with a jagged lightning line across it. disorientation — a head silhouette with a spiral inside it. bleeding — a single droplet with a small cross-hatch wound mark beside it. urination-change — a droplet inside a simplified bladder outline. behaviour-change — a brain outline with two small opposing arrows beside it. pain-response — a paw with three short radiating lines above it. Keep stroke weight, corner radius and optical size identical across all 24 so they read as one family.","hasPrompt":true},{"id":"ICN-803","alias":"","title":"Anatomy & health-condition glyph set (12)","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/anatomy/ic-anat-<name>.svg","folder":"assets/icons/anatomy/","category":"Icon family / medical illustration","usedOn":"breed_encyclopedia, breed_detail, ai_health_check_start","screens":["ai_health_check_start","breed_detail","breed_encyclopedia"],"global":false,"reusable":"Yes","transparency":"Required","format":"SVG","resolution":"24 × 24 viewBox (list) / 32 × 32 (cards)","status":"","files":12,"renamed":false,"revised":false,"priority":"P6","prompt":"A single minimal anatomical line icon centred on a pure white background, flat black, one uniform medium stroke weight, rounded caps and joins, no fill, no colour, no text, no frame. Clinically accurate in silhouette but heavily simplified; readable at 24 pixels. Subject: hip-dysplasia — a simplified hip joint: a rounded femoral head seated in a socket, with the femur shaft extending down. elbow-dysplasia — a simplified elbow joint where two long bones meet at an angle. bloat-stomach — a rounded distended stomach organ with a short oesophagus at the top. heart-anatomical — an anatomically shaped heart with two visible major vessels at the top, not a symbolic love-heart. cancer-ribbon — an awareness ribbon with crossed tails. skin-coat — a horizontal skin surface layer with five fur strands rising from it in a gentle fan. eyes-ears-nose — a compact cluster of three glyphs: a dog ear at the upper left, an eye at the upper right and a nose/muzzle below, arranged in a triangle. brain — a brain seen from the front showing two hemispheres and gentle folds. lungs — a pair of lungs with a central trachea. kidney — a single bean-shaped kidney with a short vessel stem. liver — a simplified two-lobed liver silhouette. joint — two bone ends meeting with a small gap and three short arc lines around the junction.","hasPrompt":true},{"id":"ICN-804","alias":"","title":"Vaccine pathogen tiles (8) ⭐","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/vaccines/ic-vax-<name>@3x.png","folder":"assets/icons/vaccines/","category":"Icon family / colour tiles","usedOn":"vaccination_manager, pdf_health_report_preview","screens":["pdf_health_report_preview","vaccination_manager"],"global":false,"reusable":"Yes","transparency":"No (the tile background is part of the asset)","format":"PNG (gradient fills) — or SVG if flattened to two-stop gradients","resolution":"132 × 132 @3x (44 pt rounded square, 28 % corner radius)","status":"","files":8,"renamed":false,"revised":false,"priority":"P6","prompt":"A rounded-square app tile with a 28 % corner radius, filled with a smooth diagonal two-tone gradient from the specified hue at the top-left to a darker shade of the same hue at the bottom-right, with a very subtle inner top highlight. Centred on the tile, a simple white pictogram occupying about 55 % of the tile width, drawn with clean flat shapes and no outline. Soft coloured glow beneath the tile. No text. rabies — a rounded shield containing a single bold letter-free viral capsid hexagon. dhpp — a cluster of four small connected spheres. leptospirosis — a spiral corkscrew bacterium with a soft spiked outline. bordetella — a rounded rod-shaped bacterium cell with short surface cilia. lyme — a simplified tick silhouette seen from above. influenza — a spherical virus particle with short surface spikes. parvovirus — a geometric icosahedral virus capsid. distemper — a spherical virus with a wavy envelope outline. Keep the tile geometry, gradient angle, glyph scale and glow identical across all eight.","hasPrompt":true},{"id":"ICN-805","alias":"","title":"First-aid topic tiles (8) ⭐","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/firstaid/ic-fa-<name>@3x.png","folder":"assets/icons/firstaid/","category":"Icon family / colour tiles","usedOn":"first_aid_guide","screens":["first_aid_guide"],"global":false,"reusable":"Yes (emergency content lists)","transparency":"No","format":"PNG","resolution":"156 × 156 @3x (52 pt rounded square, 26 % radius)","status":"","files":8,"renamed":false,"revised":false,"priority":"P6","prompt":"A rounded-square app tile with a 26 % corner radius, filled with a smooth diagonal gradient from the specified hue at the top-left to a darker shade at the bottom-right, with a soft glossy highlight across the upper edge. Centred on it, a bold white-and-tinted pictogram occupying about 55 % of the tile. Subtle coloured glow beneath the tile. No text. bleeding — a single large teardrop-shaped blood drop with a bright highlight. choking — a simplified throat and airway silhouette with a small blocking shape lodged in it. poisoning — a classic skull-and-crossbones. heatstroke — a thermometer with a rising red column and a small sun beside its bulb. cuts — two adhesive bandages crossed in an X. vomiting — a stomach organ outline. eye-injury — an eye with a prominent pupil and iris. other — three horizontal dots. Keep tile geometry, gradient angle, glyph scale and gloss identical across all eight.","hasPrompt":true},{"id":"ICN-806","alias":"","title":"Message-action icons (8, multicolour)","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/actions/ic-act-<name>.svg","folder":"assets/icons/actions/","category":"Icon family / multicolour","usedOn":"ai_message_actions","screens":["ai_message_actions"],"global":false,"reusable":"Yes (any AI mess ts. tips-education — a gift box with a ribbon. community — two overlapping person silhouettes. promotions — a megaphone tilted upward. No text. Keep circle size, border weight and glyph scale identical across all six.","hasPrompt":true},{"id":"ICN-808","alias":"","title":"Medication-form tiles (4)","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/medication/ic-med-<name>@3x.png","folder":"assets/icons/medication/","category":"Icon family / colour tiles","usedOn":"medication_tracker, reminder_detail","screens":["medication_tracker","reminder_detail"],"global":false,"reusable":"Yes","transparency":"No","format":"PNG","resolution":"132 × 132 @3x","status":"","files":4,"renamed":false,"revised":false,"priority":"P2","prompt":"A rounded-square app tile with a 28 % corner radius filled with a smooth diagonal gradient in the specified hue, with a soft coloured glow beneath. Centred on it, a clean white pictogram at about 55 % of the tile width: chewable — a capsule tilted 45°, split into two tones along its midline. tablet — a round pill seen face-on with a score line across the middle. liquid — a dropper bottle with a bulb top and a single droplet below its tip. topical — a squeeze tube with a cap and a small dab of cream at the nozzle. No text. Identical tile geometry across all four.","hasPrompt":true},{"id":"ICN-809","alias":"","title":"3D weather icon set (8) ⭐","aside":"","family":"ICN","familyName":"Icons","filename":"assets/icons/weather-3d/ic-wx-<name>@3x.png","folder":"assets/icons/weather-3d/","category":"Icon family / 3D raster","usedOn":"weather_walk_advisor, smart_walks","screens":["smart_walks","weather_walk_advisor"],"global":false,"reusable":"Yes","transparency":"Required","format":"PNG (3D shading — not vectorisable)","resolution":"240 × 240 @3x (hero variant 480 × 480)","status":"","files":8,"renamed":false,"revised":false,"priority":"P6","prompt":"A glossy 3D weather icon floating on a fully transparent background, rendered in a s ke clouds rising from the bottom edge of a wide frame, lit from within so they glow green — deep emerald in the dense areas, bright mint at the illuminated edges. Soft, wispy, organic forms with fine detail and gradual falloff to complete transparency at the top. Fully transparent background with alpha channel, no hard edges, no objects, no text.","hasPrompt":true},{"id":"BGD-1611","alias":"","title":"BGD-1611 / BGD-1612 / BGD-1613 — Floating glyph layers","aside":"","family":"BGD","familyName":"Decor","filename":"bgd-cross-watermark@3x.png, bgd-floating-hearts@3x.png, bgd-floating-crosses@3x.png","folder":"assets/decor/","category":"Decorative","usedOn":"000 / 006 / ai_health_check_start","screens":["000","006-onboarding","ai_health_check_start"],"global":false,"reusable":"Yes","transparency":"Required","format":"SVG","resolution":"Vector","status":"","files":1,"renamed":false,"revised":false,"priority":"P3","prompt":"Scattered decorative glyph layers on fully transparent backgrounds, each glyph drawn as a clean outline with a uniform stroke, varying in size and opacity, distributed unevenly with generous negative space and no repeating grid. (a) rounded medical crosses in very dark desaturated green at low opacity, as a subtle watermark. (b) outlined hearts in glowing cyan #22D3EE, five of them at different sizes with a soft bloom. (c) rounded medical crosses in bright lime #A3E635, three at different sizes with a soft glow. No fill, no text, alpha channel.","hasPrompt":true},{"id":"TPB-1701","alias":"","title":"Google \"G\" logo","aside":"","family":"TPB","familyName":"Third-Party","filename":"tpb-google-g.svg","folder":"assets/third-party/","category":"Third-party brand mark","usedOn":"000.png (Continue with Google)","screens":["000"],"global":false,"reusable":"Yes","transparency":"Required","format":"SVG","resolution":"Vector","status":"","files":1,"renamed":false,"revised":false,"priority":"P4","prompt":"⛔ No prompt. Registered trademark. Source the official asset from Google Identity's Sign in with Google branding guidelines and follow the mandated button geometry, clear space and minimum size. An AI-approximated \"G\" is a trademark violation and will fail Play Console brand review.","hasPrompt":false},{"id":"TPB-1702","alias":"","title":"Payment network marks (5)","aside":"","family":"TPB","familyName":"Third-Party","filename":"tpb-{visa,mastercard,amex,applepay,googlepay}.svg","folder":"assets/third-party/","category":"Third-party brand marks","usedOn":"subscription_plans","screens":["subscription_plans"],"global":false,"reusable":"Yes","transparency":"Required","format":"SVG","resolution":"Vector","status":"","files":5,"renamed":false,"revised":false,"priority":"P4","prompt":"⛔ No prompt. Registered trademarks. Source from each network's official brand centre (Visa Brand Portal, Mastercard Brand Hub, Amex Partner Toolkit, Apple Pay Marketing Guidelines, Google Pay Brand Guidelines). Apple Pay and Google Pay marks additionally carry mandatory usage rules about placement and the surrounding claim — review before shipping the pricing screen.","hasPrompt":false},{"id":"TPB-1703","alias":"","title":"RevenueCat wordmark","aside":"","family":"TPB","familyName":"Third-Party","filename":"tpb-revenuecat.svg","folder":"assets/third-party/","category":"Third-party brand mark","usedOn":"subscription_plans (\"Secure payment powered by RevenueCat\")","screens":["subscription_plans"],"global":false,"reusable":"No","transparency":"Required","format":"SVG","resolution":"Vector","status":"","files":1,"renamed":false,"revised":false,"priority":"P4","prompt":"⛔ No prompt. Source from RevenueCat's press kit. Also verify the claim is accurate — RevenueCat is a subscription-management layer, not the payment processor; the payment is processed by Apple/Google. \"Secure payment powered by RevenueCat\" as written is misleading and should be reworded regardless of the asset.","hasPrompt":false}];

<script>
"use strict";
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PRI = ["P1","P2","P3","P4","P5","P6"];
const PRI_LABEL = {P1:"P1 · Foundation",P2:"P2 · Core product",P3:"P3 · Onboarding",
  P4:"P4 · Monetisation",P5:"P5 · Content",P6:"P6 · Depth & polish"};
const FAM_ORDER = ["BRD","ONB","PET","AI","ILL","INF","EMG","PRM","ICN","BDG","AVT","MAP","MEM","BRE","CMN","DOC","BGD","TPB"];

/* ---------- derived fields ---------- */
ASSETS.forEach(a => {
  a.fmt = /SVG/i.test(a.format) ? (/PNG|WEBP/i.test(a.format) ? "SVG+Raster" : "SVG")
        : /WEBP/i.test(a.format) ? "WEBP" : /PNG/i.test(a.format) ? "PNG" : "Other";
  a.transparent = /required/i.test(a.transparency);
  a.reuse = /yes/i.test(a.reusable);
  a.rewritten = !!a.revised || !!a.renamed;
  a.blocked = /⛔|No prompt|Do not generate/i.test(a.prompt.slice(0,44)) || !a.hasPrompt;
  a.hero = /⭐/.test(a.title);
  a.titleClean = a.title.replace(/[⭐⚠️♻️⛔]/g,"").replace(/\s{2,}/g," ").trim();
  a.hay = [a.id,a.alias,a.titleClean,a.filename,a.folder,a.category,a.usedOn,a.prompt,a.familyName,
           a.screens.join(" "),a.format,a.resolution].join(" ").toLowerCase();
});

/* ---------- state ---------- */
const S = {q:"", priority:new Set(), family:new Set(), format:new Set(), attr:new Set(),
           screen:new Set(), group:"family"};

function matches(a){
  if (S.q && !a.hay.includes(S.q)) return false;
  if (S.priority.size && !S.priority.has(a.priority)) return false;
  if (S.family.size && !S.family.has(a.family)) return false;
  if (S.format.size && !S.format.has(a.fmt)) return false;
  if (S.screen.size && !a.screens.some(s => S.screen.has(s))) return false;
  for (const t of S.attr){
    if (t==="transparent" && !a.transparent) return false;
    if (t==="reusable"    && !a.reuse)       return false;
    if (t==="hero"        && !a.hero)        return false;
    if (t==="rewritten"   && !a.rewritten)   return false;
    if (t==="sourced"     && !a.blocked)     return false;
  }
  return true;
}

/* ---------- filter UI ---------- */
function countBy(key, val, extra){
  return ASSETS.filter(a => {
    const saved = S[key]; S[key] = new Set([val]);
    const ok = matches(a); S[key] = saved; return ok;
  }).length;
}
function chip(group, val, label, n, dot){
  const on = S[group].has(val);
  return `<label class="chip${on?" on":""}">
    <input type="checkbox" data-g="${group}" value="${esc(val)}"${on?" checked":""}>
    ${dot?`<span class="dot" style="color:${dot}"></span>`:""}<span>${esc(label)}</span><span class="n">${n}</span>
  </label>`;
}
const PRI_DOT = {P1:"#a3e635",P2:"#bef264",P3:"#22d3ee",P4:"#a78bfa",P5:"#fbbf24",P6:"#6b7364"};

function renderFilters(){
  $("#fpri").innerHTML = PRI.filter(p=>ASSETS.some(a=>a.priority===p))
    .map(p => chip("priority", p, p, countBy("priority",p), PRI_DOT[p])).join("");

  const fams = FAM_ORDER.filter(f => ASSETS.some(a=>a.family===f));
  $("#ffam").innerHTML = fams.map(f => {
    const nm = (ASSETS.find(a=>a.family===f)||{}).familyName || f;
    return chip("family", f, nm, countBy("family",f));
  }).join("");

  const fmts = ["SVG","SVG+Raster","PNG","WEBP","Other"].filter(f=>ASSETS.some(a=>a.fmt===f));
  $("#ffmt").innerHTML = fmts.map(f => chip("format", f, f, countBy("format",f))).join("");

  const attrs = [["hero","Key asset"],["reusable","Reusable"],["transparent","Transparency"],
                 ["rewritten","Revised r2"],["sourced","Source, don’t generate"]];
  $("#fatt").innerHTML = attrs.map(([v,l]) => {
    const saved = S.attr; S.attr = new Set([v]);
    const n = ASSETS.filter(matches).length; S.attr = saved;
    return chip("attr", v, l, n);
  }).join("");

  const scr = {};
  ASSETS.forEach(a => a.screens.forEach(s => scr[s] = (scr[s]||0)+1));
  $("#fscr").innerHTML = Object.keys(scr).sort()
    .map(s => chip("screen", s, s, scr[s])).join("");
}

function renderStats(){
  const vis = ASSETS.filter(matches);
  const files = vis.reduce((n,a) => n + (a.files || 1), 0);
  const st = [
    ["Assets", vis.length, "Specification entries matching the current filters"],
    ["Files ≈", files, "Set members (e.g. 24 symptom icons). Excludes @2x/@3x ladders and dual-format twins."],
    ["Reusable", vis.filter(a=>a.reuse).length, "Assets used on more than one screen"],
    ["Screens", new Set(vis.flatMap(a=>a.screens)).size, "Distinct mockup screens covered"]
  ];
  $("#stats").innerHTML = st.map(([l,v,t]) =>
    `<div class="stat" title="${l}: ${t}"><b>${v}</b><span>${l}</span></div>`).join("");
}

/* ---------- cards ---------- */
const ICONS = {
  copy:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  ok:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>',
  img:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 4.5-4.5 3.5 3.5 3-3L20 17"/></svg>',
  warn:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4 2.5 20h19L12 4z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  tw:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>'
};

function card(a){
  const scrMax = 5, extra = a.screens.length - scrMax;
  const screensHtml = a.screens.length
    ? a.screens.slice(0,scrMax).map(s=>`<code>${esc(s)}</code>`).join("") +
      (extra>0 ? `<code class="more" data-all="${esc(a.screens.join(" "))}">+${extra} more</code>` : "")
    : `<code>${esc(a.usedOn).slice(0,80)}</code>`;

  const tags = [
    `<span class="tag ${a.priority.toLowerCase()}">${a.priority}</span>`,
    `<span class="tag">${esc(a.familyName)}</span>`,
    a.transparent ? `<span class="tag alpha">Alpha</span>` : "",
    a.reuse ? `<span class="tag">Reusable</span>` : "",
    a.rewritten ? `<span class="tag new">Revised r2</span>` : "",
    a.blocked ? `<span class="tag stop">Source, don’t generate</span>` : ""
  ].filter(Boolean).join("");

  const note = a.status
    ? `<div class="note ${/RELEASED|resolved/i.test(a.status)?"ok":""}">${ICONS.warn}<span>${esc(a.status)}</span></div>` : "";

  const long = a.prompt.length > 520;
  return `<article class="card" id="a-${esc(a.id)}">
    <div class="chead">
      <div class="thumb" aria-hidden="true">${ICONS.img}</div>
      <div class="t">
        <span class="aid">${esc(a.id)}${a.alias?`<span class="was">was ${esc(a.alias)}</span>`:""}</span>
        <h3 class="ttl">${esc(a.titleClean)}${a.hero?" ⭐":""}</h3>
        ${a.aside?`<p class="aside">${esc(a.aside)}</p>`:""}
      </div>
    </div>
    <div class="tags">${tags}</div>
    <dl class="meta">
      <dt>Filename</dt><dd>${esc(a.filename)}</dd>
      <dt>Folder</dt><dd>${esc(a.folder)}</dd>
      <dt>Category</dt><dd class="plain">${esc(a.category)}</dd>
      <dt>Resolution</dt><dd class="plain">${esc(a.resolution)}</dd>
      <dt>Format</dt><dd class="plain">${esc(a.format)}</dd>
      <dt>Transparency</dt><dd class="plain">${esc(a.transparency)}</dd>
      <dt>Used on</dt><dd class="plain"><div class="scr">${screensHtml}</div></dd>
    </dl>
    ${note}
    <div class="pw${long?" clip":""}">
      <h4>GPT Image prompt <span class="len">${a.prompt.length} chars</span></h4>
      <pre class="prompt${a.blocked?" na":""}">${esc(a.prompt)}</pre>
      ${long?`<button class="more-btn" type="button" data-more>Show full prompt</button>`:""}
    </div>
    <div class="acts">
      <button class="cbtn main" data-copy="prompt" data-id="${esc(a.id)}"${a.blocked?" disabled":""}>${ICONS.copy} Copy Prompt</button>
      <button class="cbtn" data-copy="filename" data-id="${esc(a.id)}">${ICONS.copy} Copy Filename</button>
      <button class="cbtn" data-copy="folder" data-id="${esc(a.id)}">${ICONS.copy} Copy Folder</button>
      <button class="cbtn" data-copy="path" data-id="${esc(a.id)}">${ICONS.copy} Copy Path</button>
    </div>
  </article>`;
}

function groupsFor(list){
  const g = new Map();
  const push = (k,a) => { if(!g.has(k)) g.set(k,[]); g.get(k).push(a); };
  if (S.group === "family"){
    list.forEach(a => push(a.family + "|" + a.familyName, a));
    return [...g.entries()].sort((x,y)=>FAM_ORDER.indexOf(x[0].split("|")[0])-FAM_ORDER.indexOf(y[0].split("|")[0]))
      .map(([k,v]) => [k.split("|")[1], v]);
  }
  if (S.group === "priority"){
    list.forEach(a => push(a.priority, a));
    return PRI.filter(p=>g.has(p)).map(p => [PRI_LABEL[p], g.get(p)]);
  }
  list.forEach(a => (a.screens.length ? a.screens : ["Global / all screens"]).forEach(s => push(s,a)));
  return [...g.entries()].sort((x,y)=>{
    if (x[0].startsWith("Global")) return -1;
    if (y[0].startsWith("Global")) return 1;
    return x[0].localeCompare(y[0]);
  });
}

let openState = {};
function render(){
  const vis = ASSETS.filter(matches);
  $("#shown").textContent = vis.length;
  $("#total").textContent = ASSETS.length;
  renderStats();

  const box = $("#results");
  if (!vis.length){
    box.innerHTML = `<div class="empty"><b>No assets match</b>Try clearing a filter or searching for something else.</div>`;
    return;
  }
  const grouped = groupsFor(vis);
  const searching = S.q.length > 0 || S.screen.size > 0;
  box.innerHTML = grouped.map(([name, items]) => {
    const key = S.group + ":" + name;
    const open = key in openState ? openState[key] : (searching || grouped.length <= 8);
    return `<details class="sec"${open?" open":""} data-key="${esc(key)}">
      <summary><span class="tw">${ICONS.tw}</span><h2>${esc(name)}</h2><span class="cnt">${items.length}</span></summary>
      <div class="grid">${items.map(card).join("")}</div>
    </details>`;
  }).join("");
}

/* ---------- clipboard ---------- */
let toastT;
function toast(msg, err){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastT);
  toastT = setTimeout(()=> t.className = "toast" + (err?" err":""), 1900);
}
async function copy(text){
  if (!text) return false;
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function joinPath(a){
  const n = a.filename.split(/\s*\+\s*/)[0].trim();
  // icon-family entries already carry the full path in the Filename field
  if (n.startsWith("assets/")) return n;
  return a.folder.replace(/\/+$/,"") + "/" + n;
}

document.addEventListener("click", async e => {
  const cp = e.target.closest("[data-copy]");
  if (cp){
    const a = ASSETS.find(x => x.id === cp.dataset.id);
    if (!a) return;
    const map = {prompt:a.prompt, filename:a.filename, folder:a.folder, path:joinPath(a)};
    const val = map[cp.dataset.copy];
    const ok = await copy(val);
    if (ok){
      const html = cp.innerHTML;
      cp.classList.add("ok");
      cp.innerHTML = ICONS.ok + " Copied";
      setTimeout(()=>{ cp.classList.remove("ok"); cp.innerHTML = html; }, 1250);
      toast(cp.dataset.copy === "prompt" ? `Prompt copied — ${a.id}` : `Copied: ${val}`);
    } else toast("Copy failed — select the text manually", true);
    return;
  }
  const mb = e.target.closest("[data-more]");
  if (mb){
    const pre = mb.parentElement.querySelector(".prompt");
    const open = pre.classList.toggle("open");
    mb.textContent = open ? "Show less" : "Show full prompt";
    return;
  }
  const more = e.target.closest("code.more");
  if (more){
    const wrap = more.parentElement;
    wrap.innerHTML = more.dataset.all.split(" ").map(s=>`<code>${esc(s)}</code>`).join("");
    return;
  }
  const rst = e.target.closest("[data-reset]");
  if (rst){ S[rst.dataset.reset].clear(); renderFilters(); render(); return; }
});

/* remember open/closed sections */
document.addEventListener("toggle", e => {
  const d = e.target.closest("details.sec");
  if (d) openState[d.dataset.key] = d.open;
}, true);

/* ---------- filters ---------- */
document.addEventListener("change", e => {
  const cb = e.target.closest("input[data-g]");
  if (!cb) return;
  const set = S[cb.dataset.g];
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  openState = {};
  renderFilters(); render();
});

let qT;
$("#q").addEventListener("input", e => {
  $("#clr").hidden = !e.target.value;
  clearTimeout(qT);
  qT = setTimeout(()=>{ S.q = e.target.value.trim().toLowerCase(); openState = {}; render(); }, 110);
});
$("#clr").addEventListener("click", ()=>{
  $("#q").value = ""; $("#clr").hidden = true; S.q = ""; openState = {}; render(); $("#q").focus();
});

$$("[data-group]").forEach(b => b.addEventListener("click", ()=>{
  S.group = b.dataset.group; openState = {};
  $$("[data-group]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

$("#expand").addEventListener("click", ()=> $$("details.sec").forEach(d=>{d.open=true;openState[d.dataset.key]=true}));
$("#collapse").addEventListener("click", ()=> $$("details.sec").forEach(d=>{d.open=false;openState[d.dataset.key]=false}));

$("#copyAll").addEventListener("click", async ()=>{
  const vis = ASSETS.filter(matches).filter(a=>!a.blocked);
  if (!vis.length) return toast("Nothing to copy", true);
  const txt = vis.map(a =>
    `### ${a.id} — ${a.titleClean}\nFile:   ${a.filename}\nFolder: ${a.folder}\n\n${a.prompt}\n`
  ).join("\n" + "-".repeat(72) + "\n\n");
  toast(await copy(txt) ? `Copied ${vis.length} prompts` : "Copy failed", false);
});

/* ---------- mobile nav ---------- */
const closeNav = ()=>{ document.body.classList.remove("nav"); $("#menu").setAttribute("aria-expanded","false"); };
$("#menu").addEventListener("click", ()=>{
  const on = document.body.classList.toggle("nav");
  $("#menu").setAttribute("aria-expanded", String(on));
  if (on) $("#q").focus();
});
$("#scrim").addEventListener("click", closeNav);

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "/" && !typing){ e.preventDefault(); document.body.classList.add("nav"); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape"){
    if (document.body.classList.contains("nav")) closeNav();
    else if ($("#q").value){ $("#clr").click(); }
    else { ["priority","family","format","attr","screen"].forEach(k=>S[k].clear()); renderFilters(); render(); toast("Filters cleared"); }
  }
  else if ((e.key === "e" || e.key === "E") && !typing && !e.metaKey && !e.ctrlKey){
    const anyClosed = $$("details.sec").some(d=>!d.open);
    $$("details.sec").forEach(d=>{ d.open = anyClosed; openState[d.dataset.key] = anyClosed; });
  }
});

/* ---------- go ---------- */
renderFilters();
render();
if (location.hash){
  const el = document.querySelector(location.hash);
  if (el){ el.classList.add("hl"); el.scrollIntoView({block:"center"}); }
}
</script>
</body>
